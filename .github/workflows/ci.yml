name: CI

# Vercel が実行するのと同じ `npm run build`（tsc -b && vite build）を回して、
# 壊れたビルドが main に入る前に弾く。CI が緑なら Vercel でも通る、を保証するのが目的。
on:
  push:
    branches: [main, master]
  pull_request:

# 読み取りだけで足りる。デプロイは Vercel の Git 連携に任せる。
permissions:
  contents: read

# 同じ ref で新しい push が来たら古い実行は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # lockfile どおりに厳密インストール（Vercel と同じ再現性）
      - run: npm ci

      # tsc -b で型検査、vite build で本番ビルド。どちらか失敗すれば CI は赤。
      - run: npm run build
      - run: npm audit --audit-level=low
